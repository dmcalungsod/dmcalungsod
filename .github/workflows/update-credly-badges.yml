name: Sync Credly Badges

on:
  schedule:
    # Runs daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Profile Data (Credly & ORCID)
        run: |
          python .github/scripts/update_credly.py
          python .github/scripts/update_orcid.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync automated profile data (Credly & ORCID)"
            git push
          fi
